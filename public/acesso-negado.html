<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Acesso Negado</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: #0f1115;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: #e6edf3;
    }
    .container {
      width: min(92vw, 600px);
      padding: 2.5rem;
      border-radius: 18px;
      background: #141821;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
      text-align: center;
    }
    .icon {
      font-size: 4rem;
      margin-bottom: 1rem;
      opacity: 0.7;
    }
    h1 {
      font-size: clamp(1.5rem, 2vw + 1.2rem, 2rem);
      margin: 0 0 1rem 0;
      color: #fff;
    }
    p {
      font-size: 1rem;
      line-height: 1.6;
      color: #a4adba;
      margin: 0 0 2rem 0;
    }
    .btn {
      display: inline-block;
      padding: 0.875rem 2rem;
      border-radius: 8px;
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.2);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: rgba(255,255,255,.15);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🔒</div>
    <h1>Acesso Negado</h1>
    <p>
      Para visualizar o conteúdo em AR, você precisa preencher o formulário de cadastro primeiro.
    </p>
    <a href="#" class="btn" onclick="history.back(); return false;">Voltar</a>
  </div>
</body>
</html>
